<div class="container hero-wrap">
  <section class="hero" aria-labelledby="hero-title">
    <img
      class="hero-image"
      ngSrc="/media/hero.webp"
      fill
      sizes="100vw"
      alt="Una mesa con platos para compartir; fotografía gastronómica ilustrativa"
      priority
    />
    <div class="hero-content">
      <p class="location"><app-icon name="pin" />COCHABAMBA, BOLIVIA</p>
      <h1 id="hero-title">El buen sabor.<br />Las grandes <em>experiencias.</em></h1>
      <p class="intro">
        Descubre dónde comer y qué visitar en Cochabamba.<br class="desktop-break" />
        Tu próxima historia empieza con un lugar.
      </p>
      <form class="search" (submit)="searchPlaces(); $event.preventDefault()">
        <app-icon name="search" /><label class="sr-only" for="home-search"
          >Buscar un lugar, comida o zona</label
        ><input
          id="home-search"
          [formControl]="search"
          maxlength="120"
          placeholder="¿Qué te gustaría descubrir?"
        /><button type="submit">Explorar<app-icon name="arrow" /></button>
      </form>
      <div class="suggestions">
        <span>¿Sin planes?</span
        ><a routerLink="/lugares" [queryParams]="{ categoria: 'restaurantes' }">Algo rico</a
        ><span class="dot">·</span
        ><a routerLink="/lugares" [queryParams]="{ categoria: 'cafes' }">Un buen café</a
        ><span class="dot">·</span
        ><a routerLink="/lugares" [queryParams]="{ categoria: 'miradores' }">Una nueva vista</a>
      </div>
    </div>
    <div class="hero-note"><span class="note-line"></span>Saborea. Explora. Descubre.</div>
  </section>
  <div class="hero-bottom">
    <span><app-icon name="compass" />Tu guía para disfrutar la Llajta</span
    ><span class="demo-label">EDICIÓN DEMOSTRACIÓN</span>
  </div>
</div>
